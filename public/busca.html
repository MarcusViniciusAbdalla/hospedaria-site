<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acomodações Disponíveis | Hospedaria Central</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/busca.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f7f4f0;
            font-family: 'Montserrat', sans-serif;
        }

        .results-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-summary-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid var(--terracotta, #d97757);
            margin-bottom: 30px;
        }

        .search-summary-card h2 {
            font-family: 'Playfair Display', serif;
            color: var(--brown-dark, #3e2723);
            margin-bottom: 5px;
        }

        .params-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        .rooms-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .room-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #eaeaea;
        }

        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .room-card-info h4 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--brown-dark, #3e2723);
            margin-bottom: 8px;
        }

        .room-amenities {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            color: #666;
            font-size: 13px;
        }

        .room-amenities span {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8f8f8;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .room-card-price {
            text-align: right;
            min-width: 200px;
        }

        .btn-select-room {
            display: inline-block;
            background: var(--terracotta, #d97757);
            color: #ffffff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .btn-select-room:hover {
            background: var(--brown-dark, #3e2723);
        }

        @media (max-width: 768px) {
            .room-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .room-card-price {
                text-align: left;
                width: 100%;
            }
            .btn-select-room {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-hotel"></i> Hospedaria Central
            </a>
            <div class="nav-right">
                <a href="index.html" style="color: white; text-decoration: none; font-weight: 600; font-size: 13px;">
                    <i class="fa-solid fa-arrow-left"></i> Voltar ao Site
                </a>
            </div>
        </div>
    </header>

    <main class="results-container">
        <div class="search-summary-card">
            <h2>Hospedaria Central Morrinhos</h2>
            <p style="color: #666;">Acomodações disponíveis em frente ao Hospital Sylvio de Mello</p>
            
            <div id="search-params-info" class="params-info">
                <!-- Informações via JS -->
            </div>
        </div>

        <h3 style="font-family: 'Playfair Display', serif; color: var(--brown-dark, #3e2723); margin: 30px 0 20px;">Acomodações Encontradas</h3>
        
        <div id="rooms-list" class="rooms-grid">
            <p style="text-align: center; color: #666; padding: 40px;">Buscando quartos disponíveis...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hospedaria Central Morrinhos - Todos os direitos reservados</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const start = params.get('start');
        const end = params.get('end');
        const adults = params.get('adults') || 1;

        document.getElementById('search-params-info').innerHTML = `
            <span><i class="fa-regular fa-calendar-check"></i> <strong>Entrada:</strong> ${start || '--'}</span>
            <span><i class="fa-regular fa-calendar-xmark"></i> <strong>Saída:</strong> ${end || '--'}</span>
            <span><i class="fa-solid fa-user-group"></i> <strong>Hóspedes:</strong> ${adults} pessoa(s)</span>
            <a href="index.html" style="color: var(--terracotta, #d97757); font-weight: 600; margin-left: auto;">Alterar Pesquisa</a>
        `;

        async function carregarQuartos() {
            const container = document.getElementById('rooms-list');
            try {
                const resp = await fetch(`/api/quartos-disponiveis?start=${start}&end=${end}&adults=${adults}`);
                const data = await resp.json();

                if (!resp.ok || !data.disponiveis || data.disponiveis.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #d9534f; padding: 30px; background: white; border-radius: 12px;">Nenhum quarto disponível para estas datas e quantidade de hóspedes.</p>';
                    return;
                }

                container.innerHTML = '';
                data.disponiveis.forEach(q => {
                    const checkoutUrl = `checkout.html?quartoId=${q.id}&start=${start}&end=${end}&adults=${adults}`;

                    container.innerHTML += `
                        <div class="room-card">
                            <div class="room-card-info">
                                <h4>Quarto 0${q.id} ${q.id === 3 ? '(Suíte Master)' : ''}</h4>
                                <p style="font-size: 13px; color: #666; margin-bottom: 5px;">${q.descricao || 'Quarto higienizado e confortável para sua estadia.'}</p>
                                <div class="room-amenities">
                                    <span><i class="fa-solid fa-wifi" style="color: var(--terracotta, #d97757);"></i> Wi-Fi Grátis</span>
                                    <span><i class="fa-solid fa-snowflake" style="color: var(--terracotta, #d97757);"></i> Climatizado</span>
                                    <span><i class="fa-solid fa-tv" style="color: var(--terracotta, #d97757);"></i> TV Digital</span>
                                </div>
                            </div>
                            <div class="room-card-price">
                                <span style="font-size: 12px; color: #888;">Total de ${q.diasReservados} diária(s)</span>
                                <div style="font-size: 26px; font-weight: 700; color: var(--brown-dark, #3e2723); margin: 4px 0;">R$ ${Number(q.valorTotal).toFixed(2)}</div>
                                <a href="${checkoutUrl}" class="btn-select-room">Escolher e Reservar</a>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar disponibilidade.</p>';
            }
        }

        carregarQuartos();
    </script>
</body>
</html>
