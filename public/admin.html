<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | Hospedaria Central</title>
    
    <!-- CSS Global e CSS Admin -->
    <link rel="stylesheet" href="public/css/global.css">
    <link rel="stylesheet" href="public/css/admin.css">
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Flatpickr (Calendário) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
</head>
<body>

    <!-- NAVEGAÇÃO -->
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-hotel"></i> Hospedaria Central
            </a>
            <div class="nav-right">
                <a href="index.html" style="color: white; text-decoration: none; font-weight: 600; font-size: 13px;">
                    <i class="fa-solid fa-arrow-left"></i> Voltar ao Site
                </a>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <div class="admin-container">
        
        <h2 style="color: var(--brown-dark); text-align: center; margin-bottom: 25px; font-family: 'Playfair Display', serif;">
            Painel Administrativo
        </h2>

        <!-- FORMULÁRIO DE BLOQUEIO PRESENCIAL -->
        <div class="admin-card">
            <h3><i class="fa-solid fa-lock"></i> Travar Data (Balcão / Presencial)</h3>
            <form id="form-bloqueio">
                <div class="admin-form-grid">
                    <div class="form-group">
                        <label>Selecione o Quarto:</label>
                        <select id="bloqueio-quarto" required>
                            <option value="1">Quarto 01 - Padrão</option>
                            <option value="2">Quarto 02 - Padrão</option>
                            <option value="3">Quarto 03 - Suíte Master</option>
                            <option value="4">Quarto 04 - Padrão</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Período de Bloqueio:</label>
                        <input type="text" id="bloqueio-datas" placeholder="Selecione Entrada e Saída" readonly required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn-admin-action">Confirmar Bloqueio</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- LISTA DE OCUPAÇÕES -->
        <div class="admin-card">
            <h3><i class="fa-solid fa-calendar-check"></i> Ocupações e Reservas</h3>
            <div id="lista-reservas" class="reservation-list">
                <p style="text-align: center; color: #777;">Carregando agenda...</p>
            </div>
        </div>

    </div>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2026 Hospedaria Central Morrinhos - Painel Restrito</p>
    </footer>

    <!-- JAVASCRIPT DO PAINEL -->
    <script>
        let checkinBloqueio = '', checkoutBloqueio = '';

        flatpickr("#bloqueio-datas", {
            mode: "range",
            locale: "pt",
            minDate: "today",
            dateFormat: "Y-m-d",
            onChange: function(selectedDates) {
                if (selectedDates.length === 2) {
                    checkinBloqueio = selectedDates[0].toISOString().split('T')[0];
                    checkoutBloqueio = selectedDates[1].toISOString().split('T')[0];
                }
            }
        });

        async function carregarAgenda() {
            const container = document.getElementById('lista-reservas');
            try {
                const resp = await fetch('/api/admin/reservas');
                const data = await resp.json();
                container.innerHTML = '';

                if (!data.reservas || data.reservas.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #777; padding: 20px;">Nenhuma reserva ou bloqueio encontrado.</p>';
                    return;
                }

                data.reservas.forEach(r => {
                    const isBloqueio = r.status_pagamento === 'bloqueado_balcao';
                    const badge = isBloqueio 
                        ? '<span class="badge badge-bloqueio">Bloqueio Balcão</span>' 
                        : '<span class="badge badge-pago">Pago via Pix</span>';

                    const clienteText = isBloqueio ? 'Atendimento Presencial' : `${r.cliente_nome} (${r.telefone || 'Sem Teletefone'})`;

                    container.innerHTML += `
                        <div class="reservation-item">
                            <div class="reservation-info">
                                <strong>Quarto ${r.numero_quarto} &nbsp; ${badge}</strong>
                                <span><i class="fa-regular fa-calendar"></i> ${r.data_checkin.split('T')[0]} até ${r.data_checkout.split('T')[0]}</span>
                                <span><i class="fa-regular fa-user"></i> ${clienteText}</span>
                            </div>
                            <button class="btn-delete" onclick="cancelarReserva(${r.id})" title="Liberar Data">
                                <i class="fa-solid fa-trash"></i> Liberar
                            </button>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<p style="color: red; text-align: center; padding: 20px;">Erro ao carregar dados do servidor.</p>';
            }
        }

        document.getElementById('form-bloqueio').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!checkinBloqueio || !checkoutBloqueio) {
                alert("Selecione o período de entrada e saída.");
                return;
            }

            const payload = {
                quartoId: document.getElementById('bloqueio-quarto').value,
                checkin: checkinBloqueio,
                checkout: checkoutBloqueio
            };

            try {
                const resp = await fetch('/api/admin/bloquear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await resp.json();
                if (resp.ok) {
                    alert(resData.mensagem);
                    document.getElementById('bloqueio-datas').value = '';
                    checkinBloqueio = ''; checkoutBloqueio = '';
                    carregarAgenda();
                } else {
                    alert(resData.erro);
                }
            } catch (err) {
                alert("Erro ao enviar dados do bloqueio.");
            }
        });

        async function cancelarReserva(id) {
            if (confirm("Tem certeza que deseja liberar esta data no sistema?")) {
                await fetch(`/api/admin/reservas/${id}`, { method: 'DELETE' });
                carregarAgenda();
            }
        }

        carregarAgenda();
    </script>
</body>
</html>
